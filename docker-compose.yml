services:
  mongodb:
    image: mongo:7.0
    container_name: security-gateway-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=security_gateway
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ml-service:
    container_name: security-gateway-ml
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    container_name: security-gateway-backend
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/security_gateway
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_TIMEOUT_MS=1500
      - RISK_LOW_MAX=29
      - RISK_MEDIUM_MAX=69
      - MAX_REQUEST_BODY_BYTES=65536
      - RATE_LIMIT_PER_MINUTE=60
    depends_on:
      ml-service:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 25s

  frontend:
    container_name: security-gateway-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  mongodb_data:
    driver: local
